version: '3.8'

services:
  # 1. Ollama Servisi (GPU Destekli Yerel LLM Motoru)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # İzlediğiniz videodaki '--gpus all' komutunun Docker Compose üzerindeki karşılığıdır.
    # Bu kısım yerel NVIDIA GPU'nuzun konteyner tarafından kullanılmasını sağlar.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # 2. Python Web ve RAG Uygulamanız (Streamlit & Pydantic AI)
  app:
    build: .
    container_name: rag-app-service
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_API_BASE=http://ollama:11434  # Konteyner içi ortak ağ bağlantısı
    volumes:
      - ./data:/app/data  # LanceDB vektör tabanı ve sözleşmeleri yerelde saklamak için
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data: